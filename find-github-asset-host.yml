name: Find GitHub Asset Host

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve githubassets.com
        run: |
          echo "DNS:"
          getent hosts githubassets.com || true

      - name: Show HTTPS metadata
        run: |
          curl -sSI https://githubassets.com/ | head -30

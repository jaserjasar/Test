name: PR Input Injection Lab

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Controlled PR title test
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title received:"
          printf '%s\n' "$PR_TITLE"

      - name: Safe marker check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -Fq 'LAB_MARKER_456'; then
            echo "LAB_MARKER_FOUND=yes"
          else
            echo "LAB_MARKER_FOUND=no"
          fi

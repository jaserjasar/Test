name: Actions Permission Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -sS \
            -o /tmp/repo.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")

          echo "REPOSITORY_STATUS=$STATUS"

      - name: Test workflow administration permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -sS \
            -o /tmp/workflows.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows")

          echo "WORKFLOW_LIST_STATUS=$STATUS"

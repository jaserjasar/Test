name: Permission Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -o /tmp/repo.json -w "READ_STATUS=%{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}

      - name: Try issue write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -o /tmp/issue.json -w "ISSUE_STATUS=%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"title":"Actions permission test"}' \
            https://api.github.com/repos/${{ github.repository }}/issues

      - name: Try contents write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' 'Permission test' | base64 -w 0)

          curl -sS -o /tmp/content.json -w "CONTENT_STATUS=%{http_code}\n" \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"Permission test\",\"content\":\"$CONTENT\"}" \
            https://api.github.com/repos/${{ github.repository }}/contents/permission-test.txt

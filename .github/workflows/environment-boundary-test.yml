name: Environment Boundary Test

on:
  pull_request_target:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected:
    runs-on: ubuntu-latest

    environment:
      name: security-lab

    steps:
      - name: Show event context
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "REPOSITORY=${{ github.repository }}"

          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "HEAD_REPOSITORY=${{ github.event.pull_request.head.repo.full_name }}"
            echo "BASE_REPOSITORY=${{ github.event.pull_request.base.repo.full_name }}"
          fi

      - name: Harmless environment marker
        run: |
          echo "ENVIRONMENT_JOB_STARTED=yes"
          echo "NO_REAL_SECRET_USED=yes"

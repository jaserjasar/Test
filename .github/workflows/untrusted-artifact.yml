name: Untrusted Artifact Lab

on:
  pull_request:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest

    steps:
      - name: Create harmless execution-test artifact
        run: |
          mkdir -p artifact

          cat > artifact/test.sh <<'EOF'
          echo "LAB_CONTROLLED_EXECUTION_MARKER" > /tmp/lab-result.txt
          EOF

          chmod +x artifact/test.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: untrusted-lab-artifact
          path: artifact/test.sh

name: Permission Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository read permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Testing repository API access..."

          STATUS=$(curl -sS \
            -o /tmp/response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents")

          echo "CONTENTS_API_STATUS=$STATUS"

      - name: Test write permission safely
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Testing whether write permission is denied..."

          STATUS=$(curl -sS \
            -o /tmp/write-test.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d '{"title":"permission-test"}')

          echo "WRITE_PERMISSION_TEST_STATUS=$STATUS"

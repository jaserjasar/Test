name: Pull Request Target Test

on:
  pull_request_target:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check harmless lab marker
        run: |
          if grep -R "LAB_MARKER_123" . --exclude-dir=.git >/dev/null 2>&1; then
            echo "UNTRUSTED_PR_CODE_EXECUTION_CONTEXT=yes"
          else
            echo "UNTRUSTED_PR_CODE_EXECUTION_CONTEXT=no"
          fi

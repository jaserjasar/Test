name: Cache Boundary Read Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest

    steps:
      - name: Restore base cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cache-test
          key: cache-boundary-base-v2

      - name: Inspect result
        run: |
          echo "CACHE_HIT=${{ steps.cache.outputs.cache-hit }}"

          if [ -f /tmp/cache-test/marker.txt ]; then
            echo "CACHE_FOUND=yes"
            echo "CACHE_CONTENT=$(cat /tmp/cache-test/marker.txt)"
          else
            echo "CACHE_FOUND=no"
          fii

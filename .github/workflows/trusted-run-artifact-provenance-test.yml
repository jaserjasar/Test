name: Trusted Run Artifact Provenance Test

on:
  workflow_run:
    workflows:
      - "Untrusted Artifact Lab"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect triggering run
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          echo "TRIGGERING_RUN_ID=$RUN_ID"
          echo "HEAD_REPOSITORY=$HEAD_REPOSITORY"

      - name: Inspect artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "ARTIFACT_METADATA:"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | {
              id: .id,
              name: .name,
              size: .size_in_bytes,
              expired: .expired,
              created_at: .created_at
            }'

      - name: Controlled conclusion
        run: |
          echo "ARTIFACTS_EXECUTED=no"
          echo "NO_SECRETS_USED=yes"

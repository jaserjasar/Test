name: Cache Poisoning Lab - Trusted Reader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest

    steps:
      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cache-poison-test
          key: cache-poisoning-lab-v1

      - name: Inspect restored marker
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "CACHE_HIT=$CACHE_HIT"

          if [ -f /tmp/cache-poison-test/marker.txt ]; then
            echo "CACHE_FOUND=yes"
            echo "CACHE_CONTENT=$(cat /tmp/cache-poison-test/marker.txt)"
          else
            echo "CACHE_FOUND=no"
          fi

name: Secret Boundary Test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check dummy secret availability
        env:
          TEST_SECRET: ${{ secrets.SECURITY_TEST }}
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "SECRET_AVAILABLE=yes"
          else
            echo "SECRET_AVAILABLE=no"
          fi

      - name: Test repository write permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -sS \
            -o /tmp/test-write.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d '{"title":"Fork PR permission test"}')

          echo "WRITE_STATUS=$STATUS"

name: Secret Test

on:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show event
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "REPOSITORY=$GITHUB_REPOSITORY"

      - name: Check dummy secret
        env:
          TEST_SECRET: ${{ secrets.SECURITY_TEST }}
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "SECRET_AVAILABLE=yes"
          else
            echo "SECRET_AVAILABLE=no"
          fi

      - name: Check write boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -sS \
            -o /tmp/test-write.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d '{"title":"security-test-marker"}')

          echo "WRITE_STATUS=$STATUS"

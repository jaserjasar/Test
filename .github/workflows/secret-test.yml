name: Secret Boundary Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check dummy secret availability
        env:
          TEST_SECRET: ${{ secrets.SECURITY_TEST }}
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "SECRET_AVAILABLE=yes"
          else
            echo "SECRET_AVAILABLE=no"
          fi

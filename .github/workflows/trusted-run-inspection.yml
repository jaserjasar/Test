name: Trusted Run Artifact Provenance Test

on:
  workflow_run:
    workflows:
      - "Untrusted Artifact Lab"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect triggering run
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "RUN_ID=$RUN_ID"
          echo "HEAD_REPOSITORY=$HEAD_REPOSITORY"
          echo "BASE_REPOSITORY=$BASE_REPOSITORY"
          echo "CONCLUSION=$CONCLUSION"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: untrusted-lab-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-artifact

      - name: Execute harmless marker
        run: |
          chmod +x downloaded-artifact/test.sh
          ./downloaded-artifact/test.sh

          if [ -f /tmp/lab-result.txt ]; then
            echo "CONTROLLED_SCRIPT_EXECUTED=yes"
            echo "RESULT=$(cat /tmp/lab-result.txt)"
          else
            echo "CONTROLLED_SCRIPT_EXECUTED=no"
          fi

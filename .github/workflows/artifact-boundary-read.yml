name: Artifact Boundary Read Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub CLI availability
        run: gh --version

      - name: Check artifact access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking artifacts visible to this repository..."

          STATUS=$(curl -sS \
            -o /tmp/artifacts.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts")

          echo "ARTIFACT_LIST_STATUS=$STATUS"

          if [ "$STATUS" = "200" ]; then
            grep -q "artifact-boundary-lab" /tmp/artifacts.json \
              && echo "CROSS_REPOSITORY_ARTIFACT_VISIBLE=yes" \
              || echo "CROSS_REPOSITORY_ARTIFACT_VISIBLE=no"
          fi

name: Artifact Boundary Write Test

on:
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest

    steps:
      - name: Create harmless artifact
        run: |
          mkdir -p /tmp/artifact-test
          echo "ARTIFACT_BOUNDARY_BASE_789" > /tmp/artifact-test/marker.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-boundary-lab
          path: /tmp/artifact-test/marker.txt

      - name: Verify marker
        run: |
          cat /tmp/artifact-test/marker.txt
